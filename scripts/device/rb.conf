#!/bin/sh
# rb.conf — every machine-specific constant for the Pi 4 target, in one place.
#
# Sourced by the device scripts (install.sh, fix-dev.sh, start-rb.sh,
# usb-watch.sh). POSIX sh only — no bash arrays, no `local` — because the
# launcher runs under /bin/sh.
#
# Every value is a default: `: "${VAR:=value}"` keeps whatever the environment
# already had, so a one-off override works without editing this file:
#
#   RB_AUDIO_DEV='plughw:CARD=DDJFLX4,DEV=0' sh /opt/rblive4/start-rb.sh
#
# The comment on each variable names the component that actually reads it, so
# it is clear whether a change needs a rebuild.

# --- version of this file's schema ------------------------------------------
# Bumped when a variable is renamed or removed, so a stale rb.conf copied onto a
# newer tree is detectable rather than silently missing a setting.
#
# 2: RB_MIDI_DUMP became a path rather than a flag; RB_LED_VU replaced the
#    VU_DISABLE workaround, RB_LED_DISABLE/RB_PAD_BRIGHT/RB_LED_VU_SEGMENTS/
#    RB_MIDI_REPLAY_SPEED were added, and RB_VERBOSE now expands into four
#    per-module flags instead of needing a presence-semantics export.
RB_CONF_VERSION=2

# --- where things live on the Pi ---------------------------------------------
# The chroot is a soft-float ARM32 tree running on the Pi's ARMv7 kernel; the
# kernel does not care about the userspace float ABI, which is what makes this
# work at all. See docs/13-raspberrypi4.md.
: "${RB_DEPLOY_ROOT:=/opt/rblive4}"
: "${RB_CHROOT:=$RB_DEPLOY_ROOT/rbx3-run}"
: "${RB_LOG_DIR:=$RB_DEPLOY_ROOT/log}"

# Host-side path of the USB media stick. The path *inside* the chroot is fixed
# at /media/usb1/sda1 and is baked into the patched binary (patch 1 of
# tools/patch-rbp/PATCHES.md), so it is not configurable.
: "${RB_MEDIA_MOUNT:=$RB_DEPLOY_ROOT/media/usb1}"
: "${RB_CHROOT_MEDIA:=/media/usb1/sda1}"

# Explicit loader: rbp is non-PIE, soft-float, and built for glibc 2.13, so it
# is always started through the chroot's own ld.so rather than by exec.
: "${RB_LOADER:=/lib/ld-linux.so.3}"
: "${RB_PLAYER:=/root/pdj/rbp}"

# --- display -----------------------------------------------------------------
# STATE: all three of these are read by the driver as it stands. The patched
# DirectFB fbdev driver has a general present path -- off / convert / letterbox /
# crop / rotate -- and RB_FB_DEV picks the framebuffer it opens (see
# docs/06-display.md).
#
# RB_FB_DEV is the framebuffer the driver opens. It is consulted after
# usr/etc/directfbrc's `fbdev=` (which build-chroot.sh writes as /dev/fb0) and
# before FRAMEBUFFER, so the documented DirectFB option still wins; this knob is
# for moving the device without editing a file inside the chroot.
: "${RB_FB_DEV:=/dev/fb0}"

# Presentation mode: how the logical 1280x800x16 RGB565 surface the shim reports
# reaches the REAL framebuffer, whose true geometry differs per HDMI sink and is
# discoverable with tools/fbdump:
#   off       — no blit at all: the layer surface IS the fb page; fastest
#   convert   — pixel-format conversion only (565 -> 8888), for a 32bpp fb
#   letterbox — 1:1 copy centred with filled bars, for a fb BIGGER in both axes
#   crop      — 1:1 copy of the top rows, for a fb that is shorter but not
#               narrower; a row budget on the copy, no resampling
#   scale     — uniform squeeze to fit; NOT implemented, and it logs that and
#               presents without a blit rather than pretending
#   rotate    — the SC Live 4's portrait panel path (not used on a Pi; needs a
#               32bpp fb and is refused on anything else)
# On the measured Pi they are all moot: 16bpp RGB565 rules out "convert", and the
# `video=` mode in cmdline.txt gives a fb of exactly 1280x800 (stride 2560), so
# there is no crop, no squeeze and no bar to fill. "off" is therefore not a rung
# but the destination, and this knob is expected to stay where it is.
#
# Note what the measured Pi's display problem was NOT: not a present mode at all.
# The fb has ONE page while the driver asked for three buffers, so the primary
# region test failed on framebuffer memory. The driver now decides the buffer
# mode from the page count and stays FRONTONLY here (docs/06-display.md), which
# is why no value in this file is needed to fix it.
: "${RB_DFB_PRESENT:=off}"

# Rotation (the bare DFB_ROTATE the launcher exports from this); the values are
# left/right/180/off, or a degree count. Empty on a landscape HDMI monitor.
# Setting it is equivalent to RB_DFB_PRESENT=rotate plus the angle -- it wins if
# both are set, because it is the older contract and it is what the previous
# target's launcher has always carried.
: "${RB_DFB_ROTATE:=}"

# Frame pacer in milliseconds. vc4's drm_fbdev returns from FBIOPAN_DISPLAY
# without waiting for vblank, so without a pacer rbp's RT-priority-98 render
# thread spins a core at 100%. Fractional values are allowed and the default is
# the exact 60 Hz budget the shim has always used (16.666666): plain "16" is
# 62.5 fps, which is close enough to look right and not the number the timing was
# tuned against. Set 0 to disable the pacer entirely.
: "${RB_PAN_PACER_MS:=16.666666}"

# --- pointing ----------------------------------------------------------------
# Read by fbshim.so. On a Pi the pointer is whatever is plugged into USB, so the
# shim discovers it by capability, not by name. Run `tools/evdevdump --list` to
# see the candidates; it prints a ready-to-paste POINT_KIND/POINT_DEV pair.
#   auto — prefer an absolute device (touchscreen/tablet), else a relative one
#   abs  — touchscreen / tablet
#   rel  — mouse / trackball (accumulated into an absolute pointer)
#   none — no pointer; the keyboard map still drives playback
: "${RB_POINT_KIND:=auto}"
: "${RB_POINT_DEV:=}"           # empty = discover; otherwise /dev/input/eventN
: "${RB_POINT_DEBUG:=0}"        # 1 = log every emitted (down, raw, logical)
: "${RB_POINT_MIN_DWELL_MS:=45}" # hold a short tap open long enough for rbp to
                                 # see it; lower it if clicks feel laggy, raise
                                 # it if fast clicks get swallowed
: "${RB_POINT_MOUSE_SPEED:=1.0}"
: "${RB_POINT_SWAP_XY:=0}"      # axis algebra is MEASURED, not derived — see
: "${RB_POINT_INVERT_X:=0}"     # docs/07-touch.md for the four-corner procedure
: "${RB_POINT_INVERT_Y:=0}"

# --- audio -------------------------------------------------------------------
# Read by audioshim.so. The DDJ-FLX4 is USB class-compliant with 4 output
# channels: master on 1-2, headphones on 3-4.
#
# plughw, not hw: ALSA's plug chain does S24_LE <-> S24_3LE packing and
# 44.1 -> 48 kHz conversion for free, and rbp only ever speaks S24_LE at 44.1.
# Verify the card id with `aplay -L` / `cat /proc/asound/cards` — if the FLX4
# reports a different id, change it here rather than in the shim.
: "${RB_AUDIO_DEV:=plughw:CARD=DDJFLX4,DEV=0}"
# auto = negotiate from the real device (clamped to rbp's 8), otherwise a fixed
# count. Must never exceed the hardware's channel count: the route plugin is 1:1
# only while logical channels <= hw channels, and a downmix would fold FL/FR
# into the second pair and put garbage on it.
: "${RB_AUDIO_CHANNELS:=auto}"
# rbp opens three stereo streams in a fixed order plus a dummy capture. Map each
# stream onto a channel pair of the real device, or drop it with '-'.
#   master=0,1   -> real channels 1-2 (the FLX4's master out)
#   headphones=2,3 -> real channels 3-4 (the FLX4's headphone jack)
#   booth=-      -> the FLX4 has no separate booth pair; dropped with one log line
: "${RB_AUDIO_MAP:=master=0,1;headphones=2,3;booth=-}"
# Empty = no repacking: rbp's own S24_LE words go straight to the device, which
# is right for any plughw: device because ALSA's plug chain converts them. Only
# set this alongside a `hw:` device, where nothing converts for us. Accepts
# s24_le (4-byte container, the default), s24_3le (3 bytes packed) and s16_le.
# Case-insensitive; short forms s24le/s24_3/s16 also work. Any other name is
# reported in /tmp/audioshim.log and treated as unset.
: "${RB_AUDIO_FMT:=}"
: "${RB_AUDIO_MONITOR_PAIR:=}"  # extra always-on pair, if the card needs one

# USB audio has no codec power-up transient, so unlike the SC Live 4 there is
# nothing to mute over. Raise these if a card is found to thump on open.
: "${RB_STARTUP_MUTE_MS:=0}"
: "${RB_STARTUP_FADE_MS:=0}"

# The shim interposes sched_setscheduler / sched_setaffinity / the pthread_*
# equivalents and drops rbp's request for SCHED_FIFO 98 plus a pin to core 0,
# because forcing that from a preloaded library is a hang risk on any target.
#   1 (default) — the interpositions stay in force; rbp runs at normal priority
#   0           — every one of them passes through to the real function, so rbp
#                 gets the RT priority it asks for. Use this to reproduce a hang
#                 or a CPU spin that only appears under RT.
# Mind the sense of the name: 1 means "keep rbp off RT", not "let it have RT".
: "${RB_SCHED_RT:=1}"

# --- controls (DDJ-FLX4) -----------------------------------------------------
# Read by the controls shim (knobshim.so). See docs/08-controls.md.
#
# Every flag here is read BY VALUE, so 0 means off rather than "the variable
# exists" — the shim's env_on()/env_num() in scripts/shims/shimutil.h define the
# contract, and it is what lets start-rb.sh export all of these unconditionally.
# MIDI_MAP names the surface. flx4 is the DDJ-FLX4, this port's target, and is
# the default: map_flx4.c is written and fixture-tested (see
# docs/15-flx4-midi.md), and its tables are UNVERIFIED until a dump from the
# hardware confirms them -- a dump is the first step of that document's
# procedure, not a formality. jp21 is the previous target's map, kept in the
# build as a worked, measured example and as the one to select on a bench that
# has an SC Live 4 or Prime GO attached. An unknown or absent value falls back
# to flx4 too, with a loud line in /tmp/knobshim.log rather than silence.
# kbd is the keyboard fallback: no controller, no MIDI, no sequencer needed —
# the port's bring-up surface, and the one to select for a Pi with an empty USB
# bus. It is written and tested; see docs/08-controls.md for the key list.
: "${RB_MIDI_MAP:=flx4}"        # flx4 | jp21 | kbd
: "${RB_MIDI_IN_MATCH:=FLX4}"   # substring of the sequencer client/port name
: "${RB_MIDI_OUT_MATCH:=FLX4}"  # ditto, for the surface's own LED/meter port
# MIDI_DUMP is a PATH, not a flag: empty records nothing, otherwise every
# sequencer event goes to that file in the replayable format (mididump.h). It is
# opened for writing, so a stale dump is truncated rather than appended to.
: "${RB_MIDI_DUMP:=}"
# The other half: a dump to feed through the same dispatch path, in addition to
# the live port. This is how a map is developed and regression-tested with no
# controller attached. The speed divides the recorded gaps (1.0 = as recorded,
# 0 = no pacing).
: "${RB_MIDI_REPLAY:=}"
: "${RB_MIDI_REPLAY_SPEED:=1.0}"

# KBD_DEV is the keyboard fallback's bring-up aid, and the only one it has. Like
# MIDI_DUMP it is a PATH rather than a flag: empty means the reader discovers
# every /dev/input/eventN that can report key events (the keyboard *and* the
# mouse, since BTN_RIGHT and the wheel come from the mouse), otherwise it reads
# exactly that one node and nothing else. Run `tools/evdevdump --list` to see
# the candidates — with it set, the mouse is not read, so pin the keyboard only
# when the two are being confused, or to reproduce a single-device bench.
# Read by evdev_io.c; only used when MIDI_MAP=kbd, since a MIDI-only map never
# starts the reader. See docs/08-controls.md.
: "${RB_KBD_DEV:=}"

# The FLX4 has no level meters, so the VU bridge is off. LED_VU=0 is not merely
# "do not send": it skips install_meter_hook() outright, so rbp's machine code is
# not patched for a meter that is not there. LED_VU_SEGMENTS is the height of
# *rbp's* meter as the rescale assumes it (11, which is what this build lights) —
# it is not the panel's segment count, and should only change if rbp's does.
#
# Note what LED_VU=0 does NOT switch off: rbp's master cue and stereo cue mode
# are asserted by the shim whatever this is set to, because rbp has no PFL
# keycode and that is engine setup rather than meter work. The unit's own MASTER
# CUE button toggles the same engine state afterwards, from the map. See
# vu_thread() in scripts/shims/rbp_vu.c.
: "${RB_LED_VU:=0}"
: "${RB_LED_VU_SEGMENTS:=11}"
: "${RB_LED_PADS:=1}"           # pad illumination; LED_DISABLE=1 is all LEDs off
# LED_DISABLE=1 is this target's interim setting, and it is a placeholder rather
# than a preference: rbp_led.c is still shaped for the previous target's
# channels and notes, while the FLX4's MIDI-OUT illumination messages are the
# least documented part of its list. This file's reading of the list found
# LOADED, VINYL MODE and the CH LEVEL METER ramp and no transport/pad/loop LED
# notes -- but that reading is an open question, not a fact (docs/15-flx4-midi.md,
# open question 4), and it is the reason to be conservative here rather than a
# reason to trust the dark panel. With the bridge unwired, driving the old
# target's notes at an FLX4 would light nothing at best; turn this back to 0 when
# rbp_led.c has the FLX4's table.
: "${RB_LED_DISABLE:=1}"
: "${RB_PAD_BRIGHT:=0}"         # 1 = pads use the bright colour table

# The jog and pitch calibration. Both maps read these; on the FLX4 they matter
# more, because its jog is a RELATIVE encoder (0x40-centred) and JOG_PPR is the
# conversion from its counts to the revolutions-per-second float rbp's own jog
# wants. Empty means the built-in default. For the FLX4 that default is now a
# MEASURED value -- 720, from docs/15-flx4-midi.md's S5.1 procedure, which is
# `tools/aseqdump2dump.py --stats --revs N` over a platter turn: ten revolutions
# gave 7183 forward counts (718.3/rev; a single hand-turned revolution is too
# coarse to divide). Set these only to override it.
: "${RB_JOG_PPR:=}"             # jog pulses/rev; empty = 720 on the FLX4 (measured)
: "${RB_JOG_SCALE:=}"           # scales the jog POSITION, not its speed: it cancels
                                # out of the speed (dp and its divisor are both
                                # multiplied by it), and is clamped to >= 1, so it
                                # cannot convert 720 counts/rev to a smaller
                                # convention; empty = 1
: "${RB_JOG_REV:=}"             # 1 = invert the jog's direction; empty = 0
: "${RB_JOG_IDLE_MS:=}"         # ms of silence before the wheel is told it stopped
: "${RB_KNOB_SCALE:=}"          # multiplies every absolute knob's value; empty = 1.0
: "${RB_TEMPO_REV:=}"           # 1 = invert the pitch fader; empty = 0 (the list's
                                # "+" end is 0x7F/0x7F, so no inversion is needed)

# Logging. RB_VERBOSE is the umbrella and the four per-module flags default to
# it; any one of them can be turned on or off on its own. All are read by value,
# so a plain `RB_JOG_VERBOSE=0` is off rather than "set".
: "${RB_VERBOSE:=0}"
: "${RB_KNOB_VERBOSE:=$RB_VERBOSE}"   # the front end: dispatch, map selection
: "${RB_JOG_VERBOSE:=$RB_VERBOSE}"    # the jog's delta and derived speed
: "${RB_TEMPO_VERBOSE:=$RB_VERBOSE}"  # the pitch fader's 14-bit position
: "${RB_LED_VERBOSE:=$RB_VERBOSE}"    # the LED mirror

# --- services ---------------------------------------------------------------
# Engine OS is gone (this is Pi OS), so STOP_SERVICES is short. The real risks
# on the Pi are a display manager drawing over rbp and udisks2 grabbing the
# media stick before usb-watch.sh can bind it.
: "${RB_STOP_SERVICES:=lightdm gdm3 sddm}"
: "${RB_MASK_SERVICES:=udisks2 udisks2.service}"
# The console must never draw over the UI. `fbcon=map:1` in cmdline.txt is the
# primary mechanism (see docs/13-raspberrypi4.md); this is belt and braces.
: "${RB_DISABLE_GETTY:=1}"

# usb-watch.sh polls for media with a timeout; Pi OS has coreutils.
: "${RB_USB_TIMEOUT:=/usr/bin/timeout}"
: "${RB_USB_POLL_S:=2}"

# --- shim contract ----------------------------------------------------------
# Order is load-bearing: the controls shim DEFINES the globals that the audio
# shim reads (see scripts/shims/shmstate.h). Wrong order fails loudly.
: "${RB_LD_PRELOAD:=/usr/lib/fbshim.so:/usr/lib/knobshim.so:/usr/lib/audioshim.so}"
: "${RB_SHMSTATE_STRICT:=1}"
