#!/bin/sh
# rb.conf — every machine-specific constant for the Pi 4 target, in one place.
#
# Sourced by the device scripts (install.sh, fix-dev.sh, start-rb.sh,
# usb-watch.sh). POSIX sh only — no bash arrays, no `local` — because the
# launcher runs under /bin/sh.
#
# Every value is a default: `: "${VAR:=value}"` keeps whatever the environment
# already had, so a one-off override works without editing this file:
#
#   RB_AUDIO_CHANNELS=2 sh /opt/rblive4/start-rb.sh
#
# The comment on each variable names the component that actually reads it, so
# it is clear whether a change needs a rebuild.

# --- version of this file's schema ------------------------------------------
# Bumped when a variable is renamed or removed, so a stale rb.conf copied onto a
# newer tree is detectable rather than silently missing a setting.
#
# 2: RB_MIDI_DUMP became a path rather than a flag; RB_LED_VU replaced the
#    VU_DISABLE workaround, RB_LED_DISABLE/RB_PAD_BRIGHT/RB_LED_VU_SEGMENTS/
#    RB_MIDI_REPLAY_SPEED were added, and RB_VERBOSE now expands into four
#    per-module flags instead of needing a presence-semantics export.
RB_CONF_VERSION=2

# --- where things live on the Pi ---------------------------------------------
# The chroot is a soft-float ARM32 tree running on the Pi's ARMv7 kernel; the
# kernel does not care about the userspace float ABI, which is what makes this
# work at all. See docs/13-raspberrypi4.md.
: "${RB_DEPLOY_ROOT:=/opt/rblive4}"
: "${RB_CHROOT:=$RB_DEPLOY_ROOT/rbx3-run}"
: "${RB_LOG_DIR:=$RB_DEPLOY_ROOT/log}"

# Host-side paths of the two USB media slots. rbp has two, and usb-watch.sh
# fills both: the first stick the kernel brings up takes slot 1, the second takes
# slot 2. On the host the two mount points are configurable and must differ.
#
# The chroot path of slot 1 is fixed at /media/usb1/sda1 and is baked into the
# patched binary (patch 1 of tools/patch-rbp/PATCHES.md), so it is not
# configurable. Slot 2's path is not baked anywhere — rbp takes it from the FIFO
# line (ui::UsbMountManager::getMountPath() returns what the line said), which is
# why it is settable here and why it is still written in the same shape.
: "${RB_MEDIA_MOUNT:=$RB_DEPLOY_ROOT/media/usb1}"
: "${RB_CHROOT_MEDIA:=/media/usb1/sda1}"
: "${RB_MEDIA_MOUNT2:=$RB_DEPLOY_ROOT/media/usb2}"
: "${RB_CHROOT_MEDIA2:=/media/usb2/sda1}"

# Explicit loader: rbp is non-PIE, soft-float, and built for glibc 2.13, so it
# is always started through the chroot's own ld.so rather than by exec.
: "${RB_LOADER:=/lib/ld-linux.so.3}"
: "${RB_PLAYER:=/root/pdj/rbp}"

# --- display -----------------------------------------------------------------
# Read by the patched DirectFB fbdev driver, and by fbshim.so for the two that
# concern the visible pointer (RB_FB_DEV, and RB_DFB_PRESENT_FIT, which the arrow
# transcribes because it has to confine itself to the same rectangle). The driver
# has a general present path (docs/06-display.md), and RB_FB_DEV picks the
# framebuffer it opens. The geometry WATCHER's own two knobs are under "services",
# beside the USB watcher's, because that is where the other poll interval lives.
#
# RB_FB_DEV is the framebuffer the driver opens. It is consulted after
# usr/etc/directfbrc's `fbdev=` (which build-chroot.sh writes as /dev/fb0) and
# before FRAMEBUFFER, so the documented DirectFB option still wins; this knob is
# for moving the device without editing a file inside the chroot. The visible
# pointer follows it: fbshim.so draws the arrow on the same device, so setting
# this to /dev/fb1 no longer leaves the arrow behind on fb0.
: "${RB_FB_DEV:=/dev/fb0}"

# Presentation mode: how the logical 1280x800x16 RGB565 surface the shim reports
# reaches the REAL framebuffer, whose true geometry differs per HDMI sink and is
# discoverable with tools/fbdump:
#   off       — no blit at all: the layer surface IS the fb page; fastest, and
#               correct ONLY when the real fb has the logical geometry
#   convert   — pixel-format conversion only (565 -> 8888), for a 32bpp fb
#   letterbox — 1:1 copy centred with filled bars, for a fb BIGGER in both axes
#   crop      — 1:1 copy of the top rows (a row budget and a column budget on the
#               copy, no resampling), for a fb shorter but not narrower
#   scale     — uniform aspect-fit squeeze, centred, bars filled: the mode that
#               makes a panel which is not 1280x800 usable at all
#   rotate    — the SC Live 4's portrait panel path (not used on a Pi; needs a
#               32bpp fb and is refused on anything else)
#
# On the measured Pi they are all moot: 16bpp RGB565 rules out "convert", and the
# `video=` mode in cmdline.txt gives a fb of exactly 1280x800 (stride 2560), so
# there is no crop, no squeeze and no bar to fill. "off" is therefore not a rung
# on THIS panel but the destination, and this knob is expected to stay where it is.
#
# On any OTHER panel "off" is not a faster version of "scale" — it is a broken
# picture, deterministically rather than cosmetically. Under "off" the layer
# surface IS the fb page, so a bigger fb gets rbp's 2560-byte stride inside a
# wider page (a diagonal shear, every frame) and a smaller one fails the region
# test against the shimmed geometry and shows NO UI AT ALL — the signature
# docs/12 records. That is why the driver upgrades "off" to "scale" by itself
# when the real geometry disagrees; RB_DFB_PRESENT_AUTO below is the switch for
# it. Set a mode here and it is obeyed exactly, upgrade included.
#
# Note what the measured Pi's display problem was NOT: not a present mode at all.
# The fb has ONE page while the driver asked for three buffers, so the primary
# region test failed on framebuffer memory. The driver now decides the buffer
# mode from the page count and stays FRONTONLY here (docs/06-display.md), which
# is why no value in this file is needed to fix it.
: "${RB_DFB_PRESENT:=off}"

# The pixel depth rbp and DirectFB are TOLD the fb is, via FBIOGET_VSCREENINFO.
#   32 (default) — XRGB, the depth the rx3-handoff port (`rbp-pi`) renders at, and
#                  the depth this unit was MEASURED to need: it is what draws the
#                  deck-1 strip frame's right vertical whole instead of at 1/4 and
#                  1/8 coverage. See rblive4-deck-strip-frame-right-edge.
#   16           — RGB565, the RX3's own framebuffer. The configuration everything
#                  else was verified on, kept because it is correct everywhere
#                  except that one edge.
#
# This is one half of a two-part setting and must never be moved alone: rbp's
# layer-pixel-format word in the player (stock `0x00200801` DSPF_RGB16, handoff
# `0x00400c03` DSPF_RGB32) has to say the same thing, or rbp's own DS_HW driver
# plugin refuses the layer and the player dies before it opens the panel.
# MEASURED 2026-10-08: `RB_FB_LIE_BPP=32` against an unpatched (16-word) player
# is exactly that failure — SIGSEGV with fb0 black and systemd restart-looping.
#
# What 32 buys: with the geometry unchanged and only the bpp different, DirectFB's
# AUTO-FALLBACK above upgrades `off` to `convert`, so the layer surface is a
# 32-bpp SYSTEM-memory buffer (fbdev.c allocates it when the present mode is not
# off) and the driver's existing 32->16 blit writes the panel. That makes rbp's
# whole UI render at 32 bpp on a 16-bpp panel, which is the port difference the
# deck strip's one-pixel right edge is attributed to.
#
# What it costs — MEASURED on `.239` 2026-10-08, both arms 25 s from a fresh
# restart on the same screen, frame rate from the FB_VSYNC_RATE counter in
# fb_shim.c (a diagnostic, off unless its env is set):
#     frame rate   56.5/s  ->  ~46/s     (about 18 % fewer frames)
#     rbp CPU      36 %    ->  67 %      of one core
# Two parts: rbp's own renderer writes 4 MB a frame instead of 2, and the driver
# takes one full-frame convert pass. The convert exists ONLY because the panel is
# 16 bpp, so it is the part a 32-bpp framebuffer would remove. Also worth knowing
# before choosing 32: the shims that paint straight into /dev/fb0 (the cursor, the
# menu band when MENU_PLANE is not in use) are painted over by every present.
#
# Going back to 16 is this line PLUS the matching player — the value alone leaves
# a 32-word player in place, which is the refusal above, not a 16-bpp session.
: "${RB_FB_LIE_BPP:=32}"

# Pre-warm rbp's startup files into the page cache before launching it.
#   1 (default) — read rbp's startup set once, BLOCKING, just before the launch
#                 (start-rb.sh section 8b). MEASURED 2026-10-09 on `.239`: on a
#                 cold page cache rbp paints NOTHING -- its loop turns and never
#                 presents -- and clearing this threshold is what fixes it. It
#                 costs ~2.5 s of I/O the player would have done anyway, one
#                 stalling fault at a time instead of one bulk pass.
#   0           — do not pre-warm. The first start after a power-up then comes up
#                 with a black screen until the player is restarted.
: "${RB_PREWARM:=1}"

# Whether a geometry mismatch upgrades the "off" above to "scale" on its own.
#   1 (default) — yes, and it is not a convenience: see the paragraph above for
#                 what "off" does on a mismatched panel. The only way to see that
#                 behaviour with this on is to set it to 0, which is what the
#                 S10.0 drill does to reproduce the shear deliberately.
#   0           — take DFB_PRESENT literally on every panel. Use it to reproduce
#                 the shear or the blank screen, or to keep the verified "off"
#                 path bit-identical while testing something else.
# An explicit letterbox/crop/convert/rotate is always honoured; only the default
# "off" is ever upgraded. On a fb that IS the logical geometry this branch never
# runs at all, so the shipped configuration is unchanged on the measured panel.
: "${RB_DFB_PRESENT_AUTO:=1}"

# How "scale" fits the logical 1280x800 into the real fb:
#   fit (default) — aspect-fit and centred, with bars: the UI keeps its shape, so
#                   a 1280x720 panel gets 1152x720 and 64 columns of bar a side
#   stretch       — fill both axes, no bars, aspect not preserved
# (Not to be confused with the DFB_PRESENT "letterbox"/"crop" modes above: this
# knob only shapes the scale rung, it does not select it.)
: "${RB_DFB_PRESENT_FIT:=fit}"

# The frame budget for "scale", in WEIGHTED output pixels per frame (a 32bpp
# destination counts double). The driver derives a frame-skip from it — while the
# skip is under 4 and a frame costs more than budget x skip, the skip goes up — so
# a panel too big to scale within one frame degrades to a lower frame rate with a
# whole picture on the screen, rather than to a frame that never finishes. The pan
# is skipped along with the blit, so a skipped frame shows the last whole one.
#
# 2600000 is a GUESS and is labelled one: roughly 6-8 ms of a 16.67 ms budget for
# a 565->565 blit at 1080p-ish output. S10.3 is the drill that replaces it with a
# measurement. Read the one-shot `avg N ms per present` line the driver writes to
# /tmp/dfbdig9.log on the panel in question and set this from it. Past twice the
# budget the driver also logs a warning naming the real remedy, which is a
# `video=` mode nearer 1280x800 in cmdline.txt — on a 4K panel that warning is
# the deliverable, because a skip of 4 is a slideshow and not a UI.
: "${RB_DFB_PRESENT_PX_BUDGET:=2600000}"

# The frame-skip, for when you want to set it rather than have the budget derive
# it. EMPTY (the default) means auto, from RB_DFB_PRESENT_PX_BUDGET above, and
# the empty string is load-bearing here — the value IS the skip count, so the
# driver clamps 0 up to 1, i.e. "skip nothing", and never falls through to the
# budget. Set a positive number to override the calculation outright (capped at
# 8; a skip of 4 is already a slideshow). The RB_PAN_PACER_MS precedent: a bad
# budget should be a config fix rather than a rebuild.
: "${RB_DFB_PRESENT_SKIP:=}"

# Rotation (the bare DFB_ROTATE the launcher exports from this); the values are
# left/right/180/off, or a degree count. Empty on a landscape HDMI monitor.
# Setting it is equivalent to RB_DFB_PRESENT=rotate plus the angle -- it wins if
# both are set, because it is the older contract and it is what the previous
# target's launcher has always carried.
: "${RB_DFB_ROTATE:=}"

# Frame pacer in milliseconds. vc4's drm_fbdev returns from FBIOPAN_DISPLAY
# without waiting for vblank, so without a pacer rbp's RT-priority-98 render
# thread spins a core at 100%. Fractional values are allowed and the default is
# the exact 60 Hz budget the shim has always used (16.666666): plain "16" is
# 62.5 fps, which is close enough to look right and not the number the timing was
# tuned against. Set 0 to disable the pacer entirely.
: "${RB_PAN_PACER_MS:=16.666666}"

# --- pointing ----------------------------------------------------------------
# Read by fbshim.so. On a Pi the pointer is whatever is plugged into USB, so the
# shim discovers it by capability, not by name. Run `tools/evdevdump --list` to
# see the candidates; it prints a ready-to-paste POINT_KIND/POINT_DEV pair.
#   auto — prefer an absolute device (touchscreen/tablet), else a relative one
#   abs  — touchscreen / tablet
#   rel  — mouse / trackball (accumulated into an absolute pointer)
#   none — no pointer; the keyboard map still drives playback
: "${RB_POINT_KIND:=auto}"
: "${RB_POINT_DEV:=}"           # empty = discover; otherwise /dev/input/eventN
: "${RB_POINT_DEBUG:=0}"        # 1 = log every emitted (down, raw, logical)
: "${RB_POINT_MIN_DWELL_MS:=45}" # hold a short tap open long enough for rbp to
                                 # see it; lower it if clicks feel laggy, raise
                                 # it if fast clicks get swallowed
: "${RB_POINT_MOUSE_SPEED:=1.0}"
: "${RB_POINT_SWAP_XY:=0}"      # axis algebra is MEASURED, not derived — see
: "${RB_POINT_INVERT_X:=0}"     # docs/07-touch.md for the four-corner procedure
: "${RB_POINT_INVERT_Y:=0}"

# The deck QUANTIZE boxes are the one part of the PERFORMANCE screen rbp draws
# and does not bind: taps on them leave the frame pixel-identical (measured,
# docs/13), while rbp does have a keycode for the button. So the pointer path
# sends that keycode when a press starts on one of the two boxes — the same thing
# a hardware press does, screen included. The boxes are in rbp's logical space
# (x 26..88 and 666..728, y 736..776, plus a 4 px margin) and are literals in
# scripts/shims/touch_zone.c, not settings: this is UI geometry, like the
# present-path fit, and it changes only when rbp's screen does.
#
# 0 turns the tap off and leaves the whole screen to rbp.
#
# TURN IT OFF, OR EXPECT THE DOUBLE ACTION, ON THE BROWSE SCREEN. That screen's
# bottom band is the deck strip, and rbp binds a control of its own over the
# deck-1 time display there, in the same rectangle: a touch on it toggles
# TIME/REMAIN. Measured 2026-09-28 by injection — two identical taps at the
# widget's value field flipped that label and flipped it back, the label row just
# above was inert, so it is rbp's touch class and not a stray finger. A press on
# the browse screen therefore both toggles the time mode (rbp's own behaviour,
# unchanged) and flips that deck's quantize (this feature). The overlap is total
# in both axes and cannot be trimmed away: the browse screen's live band starts
# immediately below the QUANTIZE label row. docs/07-touch.md has the geometry and
# docs/13-raspberrypi4.md has the drill row.
: "${RB_POINT_QUANTIZE_TAP:=1}"

# The visible pointer. rbp's UI is the XDJ-RX3's touchscreen UI and draws no
# cursor of its own — there is nothing in the binary to reuse — so with a mouse
# the operator has no way to know where a click will land until the shim draws
# an arrow. Measured before this existed: aiming at INFO, the click landed at
# (1279,0), the screen corner, because the edge clamp had pinned the invisible
# pointer there. This is why the pointer is usable at all.
#
# It draws ONLY for a relative device (POINT_KIND=rel, or auto resolving to a
# mouse): an absolute touchscreen reports where it was touched and does not need
# an arrow. Set to 0 to see the uncomposited screen, e.g. to confirm the arrow is
# what is smearing rather than something in the UI.
: "${RB_POINT_CURSOR:=1}"
# Redraw period in ms — fractional, and much shorter than rbp's frame time, and
# both of those are measurements rather than taste. The arrow lives in the page
# rbp paints, so rbp's next repaint erases it and it can only be redrawn between
# frames. rbp repaints that page at about 60 Hz; writing a 12x19 test block at
# (640,400) and counting the redraw intervals that found it damaged gave:
#
#     16 ms  -> damaged in 91%   of intervals, block visible  9% of the time
#      1 ms  -> damaged in  6%                          visible 94%
#      0.2 ms -> damaged in 1.7%                        visible 98%
#
# At 16 ms — matching rbp, which was the first guess and is wrong — the arrow was
# on screen ~1.5 ms in every 16, and no framebuffer capture ever contained one.
# Hence the sub-millisecond default.
#
# It is not the mouse's polling rate: the position is read every tick whatever
# this says. And it is cheap — a tick that finds the arrow intact writes nothing
# at all, because a cell already holding the right pixel is left alone.
: "${RB_POINT_CURSOR_MS:=0.5}"

# The swipe-down top menu: a six-button bar (SOURCE / BROWSE / TAG LIST /
# PLAYLIST / SEARCH / MENU) that unrolls from the screen's top edge and sends the
# corresponding rbp keycode. It is the second thing the shim puts on the glass
# (the arrow is the first) and the second control it supplies that rbp does not
# bind for itself (the deck QUANTIZE boxes are the first).
#
# IT COSTS rbp THE TOP STRIP OF ITS OWN SCREEN, and that is the whole reason this
# is a setting rather than a fact. The swipe has to be reliable, so a touch that
# STARTS in the top 55 logical px is the shim's -- but only in the *middle third*
# of the width (x 426..852), and once it is the shim's, a press that never becomes
# a swipe is handed straight back to rbp as a tap at the point the finger landed
# (45 ms late, POINT_MENU_TAP_MS). So the left and right thirds of the band are
# rbp's natively -- that is where its own `INFO` button and BROWSE's sidebar cells
# are -- and inside the middle third a tap still answers, a beat later. What a tap
# there loses is the *moment*, not the control. On the BROWSE screen the band is
# the middle of the title row; on PERFORMANCE the middle of the track header.
#
# Measured on the unit with the panel open: the frame differs from the frame
# before it by exactly 1280x56 px inside the panel -- rows 0..55, 7% of the
# screen, and 0 px anywhere below it, so the panel is drawn over rbp and rbp's own
# picture is otherwise untouched. The bar was 112 rows until the operator asked
# for half the height on 2026-09-29; docs/07-touch.md has the geometry and the
# runs, including the replay's own A/B.
#
# 0 turns the whole feature off and is the honest baseline: no panel is drawn,
# and rbp's touch stream is what it would be with no menu at all (a press in the
# strip reaches rbp again). The same gate is read by both halves — the input path
# in pointsrc.c and the compositor in menu_draw.c — so "off" is one code path and
# not a second one.
: "${RB_POINT_MENU:=1}"

# Whether the menu also answers a *relative* device (a mouse or trackball). Off by
# default: a mouse has no swipe, the gesture would have to be a drag the operator
# cannot feel the edge of, and this keeps the menu and the pointer arrow mutually
# exclusive writers of the one framebuffer page. 1 exists to exercise the gesture
# from the bench with a mouse — expect a flickering arrow wherever the panel
# overlaps it, since each writer erases the other's pixels.
: "${RB_POINT_MENU_MOUSE:=0}"

# The two BEAT FX panel controls, on rbp's OWN drawing in the performance view. A
# tap on the CH SELECT value box cycles rbp's Beat FX target 1 -> 2 -> MASTER -> 1,
# and a tap on the effect-name cell above it raises a fourteen-row picker that sends
# the effect the operator chooses. Both were dead to touch: rbp's own
# `ui::touch_panel` family has no control for either, so both reach it only as the
# keycodes the FLX4's FX SELECT button and CH SELECT lever already send
# (docs/15-flx4-midi.md).
#
# IT COSTS rbp NOTHING ON THE GLASS, and that was measured before any of it was
# written: an idle capture diff at both rectangles, tapping each twice with the shim
# doing nothing, changed 0 px in the panel and 0 px in the pad strip, while the
# positive control (the segmented STATUS/BEAT FX toggle) moved 7098 px and 77921 px.
# rbp binds no touch to either box, so withholding the reports costs the operator
# nothing. The two rectangles are read off rbp's own frame and are recorded in
# fx_zone.h with the command that re-derives them.
#
# It is live only on the PERFORMANCE screen (getBrowseMode() == BROWSE_MODE_PLAY),
# re-read on every report, so a panel rbp has moved or a screen it has left cannot
# fire. 0 gives the whole panel back to rbp: the zone is not fed at all, and a
# picker left up from before is put away at startup.
: "${RB_POINT_FX_TOUCH:=1}"

# The HOT CUE pad row — the sixteen cells rbp draws across the bottom of each deck,
# four to a row, two rows, lettered A..D and E..H. A touch on a pad TRIGGERS its own
# cue, and ONLY when a cue is registered on that pad. On an empty pad it does nothing
# and creates nothing.
#
# THE SECOND HALF IS THE WHOLE SETTING. On real Pioneer gear an unlit HOT CUE pad
# STORES a cue at the playhead, so a tap that fired on an empty pad would not merely
# do the wrong thing: it would write a cue onto the operator's own track, mid-set.
# Every gate therefore fails towards doing nothing — the performance screen, rbp's
# own pad mode (a pad keycode is a beat loop in AUTO BEAT LOOP, so a deck not in HOT
# CUE mode gets nothing at all), and rbp's own isRegisteredHotCue() answer. A pad
# whose state cannot be read is treated as empty.
#
# IT COSTS rbp NOTHING ON THE GLASS, measured before any of it was written: with the
# shim doing nothing, all SIXTEEN cells tapped across both decks and both rows
# changed 416 px — the four idle blinker marks that toggle on their own, i.e. no
# response — while the positive control in the same run, rbp's own INFO control,
# moved 549,690 px. rbp binds no touch to the pad row.
#
# 0 gives the row back to rbp: the reports at those cells are rbp's, byte for byte,
# and a press left latched from before is dropped at startup.
: "${RB_POINT_HOTCUE_TOUCH:=1}"

# --- audio -------------------------------------------------------------------
# Read by audioshim.so. The DDJ-FLX4 is USB class-compliant with 4 output
# channels: master on 1-2, headphones on 3-4.
#
# hw:, NOT plughw: — and this is a measurement, not a preference.
#
# RB_AUDIO_MAP names *hardware* channel indices, so the shim has to learn the
# card's real channel count. A plughw: device cannot tell it: the plug layer's
# whole job is to make the logical channel count arbitrary, and it reports what it
# can accept, not what the card has. Measured on this unit, the FLX4 is
#
#   hw:CARD=DDJFLX4,DEV=0      -> snd_pcm_hw_params_get_channels_max() == 4
#   plughw:CARD=DDJFLX4,DEV=0  -> snd_pcm_hw_params_get_channels_max() == 10000
#
# so with plughw the shim negotiated 8 logical channels (its own MAX_OUT_CHANNELS
# ceiling) onto a 4-channel card, the map's pairs then indexed logical channels of
# a stream the plug layer was free to remix, and every write failed with -EINVAL
# for reasons the log could only show as written=-22. hw: is also why AUDIO_FMT is
# set below: with no plug chain nothing converts for us, and the packing the plug
# used to do is s24pack()'s job — see docs/09-audio.md.
#
# The card takes 44100 natively, so no resampling is needed either. Verify the id
# with `aplay -L` / `cat /proc/asound/cards`.
#
# EMPTY is the shipped default, and it means hw:CARD=<card id>,DEV=0 for whichever
# controller MIDI_MAP selects, read from the controller table
# (scripts/shims/controllers.c). Setting a device here still wins and is the way
# to point audio at something the table does not name; doctor.sh reports it when
# the two disagree. The card used to be written down only here, which is the
# drift this removes: it had nothing to do with MIDI_MAP, so selecting jp21 on a
# bench left audio pointed at the FLX4's card.
: "${RB_AUDIO_DEV:=}"
# auto = negotiate from the real device (clamped to rbp's 8), otherwise a fixed
# count. Must never exceed the hardware's channel count: the rule is that the
# logical count equals the hw count exactly, so the shim's frame is the card's
# frame and the map's indices mean what they say.
: "${RB_AUDIO_CHANNELS:=auto}"
# rbp opens three stereo streams in a fixed order plus a dummy capture. Map each
# stream onto a channel pair of the real device, or drop it with '-'.
#   master=0,1   -> real channels 1-2 (the FLX4's master out)
#   headphones=2,3 -> real channels 3-4 (the FLX4's headphone jack)
#   booth=-      -> the FLX4 has no separate booth pair; dropped with one log line
#   deck1= / deck2= -> read ONLY in external mixer mode, where they carry the two
#                   DECKS instead of the mix. Defaults 2,3 and 4,5; on the Euphonia
#                   its USB channels land on its own channel strips in order.
# NOTE the value contains ';' and rb.local.conf is SOURCED by sh, so a local
# override must be quoted — RB_AUDIO_MAP="master=0,1;deck1=2,3" — or the shell
# runs the second half as a command and the stream is silently left at master
# only. The shipped default below is safe because it sits inside ${...:=...}.
: "${RB_AUDIO_MAP:=master=0,1;headphones=2,3;booth=-}"
# Which mixer is doing the mixing.
#   internal (default) -> rbp's own channel strips run exactly as they always have:
#                   trim, EQ, isolator, fader, crossfader and rbp's FX are all in
#                   the path and the master pair carries the mix. The shipped
#                   behaviour, and the one audioshim does nothing new for.
#   external        -> the hardware on the other end of USB is the mixer. Each deck
#                   is sent RAW on its own pair (RB_AUDIO_MAP's deck1/deck2) and
#                   rbp's mix is NOT sent at all, because sending both would play
#                   every deck twice. rbp's faders, EQ, isolator, crossfader and FX
#                   therefore do nothing to what reaches the card. The tap is the
#                   deck BEFORE its channel strip, which is also why rbp's own FX
#                   cannot ride it: Beat FX and Sound Color FX are applied after the
#                   channel sum, at the master, and the master is not sent.
# Read once, in the shim's constructor, out of the environment start-rb.sh exports. It is the
# START-UP value only: the live switch below overrides it while the unit runs.
: "${RB_MIXER_MODE:=internal}"
# WHERE THE LIVE SWITCH LIVES. This file is what the mode is NOW: a word and a newline, the same
# shape as the viewer's switch files, written by the config page's mixer routing buttons. Absent
# means "keep what we were started with", so a unit nobody has switched behaves exactly as its
# conf says. It is re-read while the unit plays (audioshim.c's mixer_route_tick), and so is the
# USB bus: unplug the mixer and the route falls back to internal on its own.
: "${RB_MIXER_MODE_FILE:=/run/rblive4/mixer.mode}"
# How rbp's S24_LE words are presented to the card. With a hw: device nothing
# converts for us, so this must name a format the card actually accepts — the FLX4
# accepts S24_3LE, which is what its 24-bit samples are really packed as.
# Accepts s24_le (4-byte container), s24_3le (3 bytes packed) and s16_le.
# Case-insensitive; short forms s24le/s24_3/s16 also work. Any other name is
# reported in /tmp/audioshim.log and treated as unset.
: "${RB_AUDIO_FMT:=s24_3le}"
: "${RB_AUDIO_MONITOR_PAIR:=}"  # extra always-on pair, if the card needs one

# The HDMI mirror: the master output sent to the Pi's HDMI audio at the same time
# as the FLX4, so a screen on the desk plays what the room plays. Read by
# audioshim.so, and — unlike the rest of this block — changing any of the three
# means rebuilding and redeploying the shim, not just restarting rbp.
#
# A space-separated list of devices, tried in order; the first that opens is used.
# Each `hw:` entry is followed automatically by its `plughw:` form, so writing the
# hw name is enough. rb.local.conf is the place for a per-unit list.
#
# hw:, NOT plughw:, and the way that was got wrong is worth reading before it is
# changed back. The vc4 HDMI PCMs offer exactly one format — IEC958_SUBFRAME_LE,
# 32-bit samples, 2ch, 32000-48000 Hz — so the question is only whether something
# will convert to it for us. A HOST aplay says yes (the Pi OS libasound's plug
# advertises 32 logical formats there and plays S24_3LE happily), and that answer
# is wrong for this shim: rbp and audioshim.so run against the CHROOT's older
# libasound, where the plug advertises the same single format and answers
# -EINVAL to everything else:
#
#   chroot /opt/rblive4/rbx3-run /tmp/pcmprobe plughw:CARD=vc4hdmi0,DEV=0 32 nonblock
#     mask: IEC958_SUBFRAME_LE / set_format FAILED Invalid argument (-22)
#   ... plughw:CARD=vc4hdmi0,DEV=0 18 nonblock   -> the whole sequence, and a write
#
# So there is no conversion to lean on and `hw:` — no plugin under it — is the
# route. tools/pcmprobe grew a sequence mode for exactly this; a host aplay is not
# an oracle for the chroot's libasound.
#
# Both ports are listed because moving the monitor's cable is ordinary; a
# disconnected port fails at open (measured), so having it in the list costs one
# failed open and no write.
#
# An EMPTY value turns the mirror off. It never affects the FLX4: the mirror is
# opened non-blocking, written non-blocking, drops blocks rather than waiting, and
# is never allowed to disturb the master path. docs/09-audio.md has the design.
: "${RB_AUDIO_MIRROR_DEV:=hw:CARD=vc4hdmi0,DEV=0 hw:CARD=vc4hdmi1,DEV=0}"
# What the mirror's blocks are packed as, and on this device only one name works:
# subframe_le, a genuine IEC 60958 subframe rather than a 4-byte container -- the
# sample sits at bits 4..27 and its even-parity bit at 31, which is the only shape
# the vc4 DMA passes through unrepacked (s24pack.c has the layout and the driver
# evidence). It is a name RB_AUDIO_FMT does not accept, because it is not a
# container a card takes from rbp — it is what the HDMI device demands. s24_le,
# s24_3le and s16_le remain valid here and are the right choice on a device that
# converts for us; on the vc4 PCMs each of them is a named -EINVAL at set_format
# in the log.
: "${RB_AUDIO_MIRROR_FMT:=subframe_le}"
# How long to wait before retrying a mirror that has gone down (the monitor was
# unplugged, or the sink refused), doubling from 500 ms up to this ceiling. 0
# means try once at startup and never again. The attempt runs on rbp's audio
# thread, which is why it is bounded rather than a timer.
: "${RB_AUDIO_MIRROR_REOPEN_MS:=5000}"
# The mirror's fixed level lift, in dB. This is the only thing on this port that
# puts the HDMI out above the master's own level, and it exists because nothing
# else there can: the MASTER LEVEL knob reaches unity at 1 o'clock and is flat
# above it (measured), and the Pi's vc4 HDMI card has NO ALSA mixer control at all
# -- `amixer -c 1 scontrols` is empty -- so before this the only volume on the HDMI
# out was the monitor's own OSD. The chosen 4 dB comes from the measured headroom
# of a played run: its loudest block peaked at 3 229 776 of 8 388 608, i.e.
# -8.3 dBFS, so +4 lands that peak near -4.3 dBFS. Peaks that still run out of
# headroom now CLIP rather than wrap (a wrapped sample is the loud-and-very-
# distorted failure S4.6 measured), and `clips=` on the mirror `#N` log line counts
# them -- watch it after changing this or after playing material with more
# dynamic range than the run this number came from. 0 restores the old behaviour
# exactly; negative sits the mirror below the master. The shim accepts -24..+12 dB
# and logs whatever it was given, so a mis-keyed order of magnitude cannot reach the
# samples. It never touches the FLX4: the master path has its own gain and this one
# is applied to the mirror's copy alone.
: "${RB_AUDIO_MIRROR_BOOST_DB:=4}"

# The mirror's LEVEL is not here: it comes from the FLX4's own MASTER LEVEL knob,
# which the controls shim reads and publishes as g_mirror_gain (RB_MIRROR_GAIN_MID
# below says where in that knob's travel the mirror reaches full level). That knob
# is an attenuator and is flat above its knee, so the lift above is what its top
# travel is worth; the two multiply.

# Hold every output channel at zero for this long after the first write, then
# fade in. This was 0 on the theory that USB audio has no codec power-up
# transient to mute over -- the DDJ-FLX4 was found to thump on open (2026-09-26,
# a loud pop/buzz the moment rbp first touches the card), so the theory was
# wrong for the card this port is aimed at and the mute is now on by default.
# The cost when it is unnecessary is 1.5 s of silence at startup.
#
# Lower STARTUP_MUTE_MS if the audio is simply late coming up; raise it if the
# pop survives. Set either to 0 in rb.local.conf to go back to no mute on a card
# that does not need one. docs/09-audio.md has the mechanism.
: "${RB_STARTUP_MUTE_MS:=1500}"
: "${RB_STARTUP_FADE_MS:=300}"

# The shim interposes sched_setscheduler / sched_setaffinity / the pthread_*
# equivalents and drops rbp's request for SCHED_FIFO 98 plus a pin to core 0,
# because forcing that from a preloaded library is a hang risk on any target.
#   1 (default) — the interpositions stay in force; rbp runs at normal priority
#   0           — every one of them passes through to the real function, so rbp
#                 gets the RT priority it asks for. Use this to reproduce a hang
#                 or a CPU spin that only appears under RT.
# Mind the sense of the name: 1 means "keep rbp off RT", not "let it have RT".
: "${RB_SCHED_RT:=1}"

# --- controls (DDJ-FLX4) -----------------------------------------------------
# Read by the controls shim (knobshim.so). See docs/08-controls.md.
#
# Every flag here is read BY VALUE, so 0 means off rather than "the variable
# exists" — the shim's env_on()/env_num() in scripts/shims/shimutil.h define the
# contract, and it is what lets start-rb.sh export all of these unconditionally.
# MIDI_MAP names the surface, and it is the KEY into the controller table
# (scripts/shims/controllers.c). A row there writes down, once, the four facts
# that used to live in four files that never referenced each other: which map the
# surface selects, the ALSA port-name substring it is DETECTED by, its sound
# card, and its USB id. The same table is what `controllers_cli` prints, so
# doctor.sh and install.sh read the one copy rather than keeping their own.
#
# The table's rows today:
#   flx4  the DDJ-FLX4, this port's target and the table's default row.
#         map_flx4.c is written and fixture-tested (see docs/15-flx4-midi.md),
#         and its tables are UNVERIFIED until a dump from the hardware confirms
#         them -- a dump is the first step of that document's procedure, not a
#         formality.
#   jp21  the previous target's map, kept in the build as a worked, measured
#         example and as the one to select on a bench that has an SC Live 4 or
#         Prime GO attached. Its port hint and card id are recorded as UNKNOWN
#         rather than guessed: that surface is not in the sequencer list and so
#         comes up on the rawmidi route instead.
#
# kbd and none are MAPS, not controllers, and are deliberately not table rows:
# kbd is the keyboard fallback (no controller, no MIDI, no sequencer needed --
# the port's bring-up surface, and the one to select for a Pi with an empty USB
# bus; the key list is in docs/08-controls.md), and none means "no MIDI surface at
# all". Under either, the table's default row is still what is looked for by name.
# An unknown or absent value falls back to that row too, with a loud line in
# /tmp/knobshim.log rather than silence.
: "${RB_MIDI_MAP:=}"            # flx4 | jp21 | kbd | none (empty = the table's default)
# The two matches are the surface's port-name substring in the sequencer's client
# and port lists, and EMPTY means "the selected row's own hint" -- which is what
# keeps detection and the mapping in step. These used to name the surface here as
# "FLX4" while the surface itself was chosen on the line above, so selecting jp21
# went on looking for a port named FLX4 and found the wrong device, silently, if
# one was attached. Set either by hand only to look for a port the table does not
# name; a JP21 row has no hint at all, and an empty value there is what lets its
# rawmidi route take over.
: "${RB_MIDI_IN_MATCH:=}"       # substring of the sequencer client/port name
: "${RB_MIDI_OUT_MATCH:=}"      # ditto, for the surface's own LED/meter port
#
# CTRL_KEEPALIVE is the one behaviour here that is NOT a de-duplication. The
# FLX4's row carries a 12-byte vendor SysEx (F0 00 40 05 00 00 04 05 00 50 02 F7)
# that the sibling port sends every 200 ms, on the claim -- theirs, from a
# Wireshark reverse-engineering, not a measurement of this port -- that the device
# "only reports controls and keeps its audio path alive while the host polls it".
# This port had no way to send it at all: the panel output path carries the
# three-byte Note On/Off and CC only, and drops anything else. Now it can, and
# this knob is its switch: 1 (the default) sends the selected surface's keepalive
# at its row's
# period, 0 sends none and leaves everything else exactly as it was.
#
# Said plainly because it decides how to read the drill: this port has NEVER sent
# one and is not obviously broken -- LEDs, meters, faders and pads are all
# measured working -- and it may never need to, since rbp_led.c already re-sends
# the whole LED state on the FLX4's own port every 100 ms, where the sibling's
# bridge writes LEDs only on change and so goes quiet between them. Whether that
# already covers it is a bench measurement, not a fact to assume; the shim logs
# each send, so CTRL_KEEPALIVE=0 against 1 is a real control.
: "${RB_CTRL_KEEPALIVE:=1}"

# EVDEV_MAP is the OTHER half of the selection, and the two are independent:
# MIDI_MAP picks the sequencer surface, EVDEV_MAP picks the non-MIDI one
# (/dev/input/event*, i.e. the keyboard and the mouse's buttons and wheel). Both
# are live at once, which is the point -- a controller and a keyboard drive rbp
# together with no configuration, and the keyboard no longer needs MIDI_MAP=kbd
# (which used to be the only way to get one, at the cost of the controller).
#
# kbd is the keyboard map: the whole key list is in docs/08-controls.md. `none`
# is a real selection rather than a missing one -- it means "no keyboard and no
# mouse buttons", which is how the old flx4-only behaviour is asked for on
# purpose. The default is kbd, so `MIDI_MAP=none EVDEV_MAP=kbd` is a Pi with no
# controller, and the shipped default here is both surfaces at once.
: "${RB_EVDEV_MAP:=kbd}"        # kbd | none
# MIDI_DUMP is a PATH, not a flag: empty records nothing, otherwise every
# sequencer event goes to that file in the replayable format (mididump.h). It is
# opened for writing, so a stale dump is truncated rather than appended to.
: "${RB_MIDI_DUMP:=}"
# The other half: a dump to feed through the same dispatch path, in addition to
# the live port. This is how a map is developed and regression-tested with no
# controller attached. The speed divides the recorded gaps (1.0 = as recorded,
# 0 = no pacing).
: "${RB_MIDI_REPLAY:=}"
: "${RB_MIDI_REPLAY_SPEED:=1.0}"

# KBD_DEV is the keyboard fallback's bring-up aid, and the only one it has. Like
# MIDI_DUMP it is a PATH rather than a flag: empty means the reader discovers
# every /dev/input/eventN that can report key events (the keyboard *and* the
# mouse, since BTN_RIGHT and the wheel come from the mouse), otherwise it reads
# exactly that one node and nothing else. Run `tools/evdevdump --list` to see
# the candidates — with it set, the mouse is not read, so pin the keyboard only
# when the two are being confused, or to reproduce a single-device bench.
# Read by evdev_io.c whenever the EVDEV_MAP selection asks for a non-MIDI source,
# which `kbd` (the default) does. It used to be "only used when MIDI_MAP=kbd",
# back when the one selected map had to answer for both a controller and a
# keyboard; what governs it now is EVDEV_MAP, and the two maps are independent.
# See docs/08-controls.md.
: "${RB_KBD_DEV:=}"

# The VU bridge is ON, and the paragraph this used to carry was wrong twice over.
# "The FLX4 has no level meters" was wrong: Pioneer's own list documents a CH
# LEVEL METER on CC 2, one value per channel, and the panel's LEDs are lit by the
# host.
#
# The second wrong half was the conclusion drawn from it — that a CC ramp cannot
# be fed to a bridge built on rbp's 11-segment bitmask. It does not need to be.
# rbp's bitmask is still what the bridge READS (install_meter_hook() patches
# rbp's getLedValue, which is unchanged and is what makes the panel's meter and
# rbp's agree); only the VALUE SENT differs, and that is now the surface's own
# business. The FLX4 takes a level in Pioneer's published bands, the SC Live 4 a
# segment bitmask, and both are rows in the selected map's led_notes — see
# scripts/shims/ctrl_map.h and docs/15-flx4-midi.md.
#
# So the flag no longer means "this target has no meters" (the map says that, and
# a surface with no meter row gets no hook installed and no traffic whatever this
# is set to). It is a manual OFF switch: LED_VU=0 silences the meter bridge on a
# target that does have one.
#
# LED_VU_SEGMENTS is the height of *rbp's* meter as the rescale assumes it (11,
# which is what this build lights) — it is not the panel's segment count, and
# should only change if rbp's does.
#
# Note what LED_VU does NOT switch off either way: rbp's master cue and stereo cue
# mode are asserted by the shim whatever this is set to, because rbp has no PFL
# keycode and that is engine setup rather than meter work. The unit's own MASTER
# CUE button toggles the same engine state afterwards, from the map. See
# vu_thread() in scripts/shims/rbp_vu.c.
: "${RB_LED_VU:=1}"
: "${RB_LED_VU_SEGMENTS:=11}"
: "${RB_LED_PADS:=1}"           # pad illumination; LED_DISABLE=1 is all LEDs off
# LED_DISABLE=0 is this target's setting as of the LED pass, and the reason the
# comment above used to give for keeping it at 1 is gone: rbp_led.c no longer
# holds any note numbers. The panel's numbers now live in the selected map's
# struct led_notes (map_flx4.c), rbp_led.c walks that table, and a -1 row sends
# NOTHING rather than the previous target's note. That is what makes switching
# this on safe before the FLX4's illumination notes are known: every row that has
# not been measured to light is -1, so the bridge can run and be seen to run
# while transmitting nothing. As notes are measured (docs/15-flx4-midi.md's LED
# section, open question 4) each becomes a one-line edit in map_flx4.c.
#
# What LED_DISABLE=0 must never be read as: permission to fill a row with a
# guess. The SC Live 4's numbers driven at this panel do not land on dead LEDs,
# they land on controls -- the JP21 pads are notes 15+ on channels 4/5, and the
# Beat FX section's FX CH SELECT legs are notes 16/17 there -- so a wrong note is
# a phantom button press. test_flx4.c fails the suite if a row carries a number
# the other table already uses.
: "${RB_LED_DISABLE:=0}"
: "${RB_PAD_BRIGHT:=0}"         # 1 = pads use the bright colour table
# PAD_BRIGHT is inert on this target until the pad ENCODING is measured: the
# FLX4's pad_enc is LED_ENC_NONE, so rbp_led.c falls through to a plain on and
# ignores both this flag and the brightness bit. It was already inert in effect
# (LED_DISABLE=1 meant no pad message was sent at all), but that was a
# coincidence of the switch rather than a property of the code. Set it from the
# measured colour result, not from the SC Live 4's behaviour.

# The jog and pitch calibration. Both maps read these; on the FLX4 they matter
# more, because its jog is a RELATIVE encoder (0x40-centred) and JOG_PPR is the
# conversion from its counts to the revolutions-per-second float rbp's own jog
# wants. Empty means the built-in default. For the FLX4 that default is now a
# MEASURED value -- 720, from docs/15-flx4-midi.md's S5.1 procedure, which is
# `tools/aseqdump2dump.py --stats --revs N` over a platter turn: ten revolutions
# gave 7183 forward counts (718.3/rev; a single hand-turned revolution is too
# coarse to divide). Set these only to override it.
: "${RB_JOG_PPR:=}"             # jog pulses/rev; empty = 720 on the FLX4 (measured)
: "${RB_JOG_SCALE:=}"           # scales the jog POSITION, not its speed: it cancels
                                # out of the speed (dp and its divisor are both
                                # multiplied by it), and is clamped to >= 1, so it
                                # cannot convert 720 counts/rev to a smaller
                                # convention; empty = 1
: "${RB_JOG_REV:=}"             # 1 = invert the jog's direction; empty = 0
: "${RB_JOG_IDLE_MS:=}"         # ms of silence before the wheel is told it stopped
: "${RB_KNOB_SCALE:=}"          # multiplies every absolute knob's value; empty = 1.0
: "${RB_TEMPO_REV:=}"           # 1 = invert the pitch fader; empty = 0 (the list's
                                # "+" end is 0x7F/0x7F, so no inversion is needed)
: "${RB_MIRROR_GAIN_MID:=}"     # where the HDMI mirror reaches unity in the FLX4's
                                # MASTER LEVEL knob travel, as a fraction of the raw
                                # 14-bit range; empty = 0.6, i.e. 1 O'CLOCK is full
                                # level and the travel above it is flat. Measured from
                                # the knob's own stops -- the pot pins at raw 0 and
                                # raw 16383, and the hand rests at raw 0.50, which is
                                # 12 o'clock -- so 12 o'clock now reads 0.833 and is no
                                # longer full level, while the bottom is still silence.
                                # Read by map_flx4.c (env_dnum), which is why it is in
                                # SHIM_VARS and not the audio block: the knob is a
                                # controls-shim thing and the mirror's gain is what it
                                # writes. 1.0 restores the first law (unity at the
                                # stop) exactly and 0.5 restores the middle knee, so
                                # this is its own rollback. Values <= 0 or > 1 are
                                # ignored. Dial it by ear -- it is a preference, and
                                # flx4_mastervol_gain() carries the derivation.
                                # Why it is not simply the position: rb.conf's audio
                                # block has the argument, and docs/09-audio.md the
                                # measurement -- at 0.5 the HDMI was too quiet to use
                                # and the knob had to be cranked to the stop, because
                                # gain > 1 would clip the mirror's 24-bit samples.

# Logging. RB_VERBOSE is the umbrella and the four per-module flags default to
# it; any one of them can be turned on or off on its own. All are read by value,
# so a plain `RB_JOG_VERBOSE=0` is off rather than "set".
: "${RB_VERBOSE:=0}"
: "${RB_KNOB_VERBOSE:=$RB_VERBOSE}"   # the front end: dispatch, map selection
: "${RB_JOG_VERBOSE:=$RB_VERBOSE}"    # the jog's delta and derived speed
: "${RB_TEMPO_VERBOSE:=$RB_VERBOSE}"  # the pitch fader's 14-bit position
: "${RB_LED_VERBOSE:=$RB_VERBOSE}"    # the LED mirror

# --- services ---------------------------------------------------------------
# Engine OS is gone (this is Pi OS), so STOP_SERVICES is short. The real risks
# on the Pi are a display manager drawing over rbp and udisks2 grabbing the
# media stick before usb-watch.sh can bind it.
: "${RB_STOP_SERVICES:=lightdm gdm3 sddm}"
: "${RB_MASK_SERVICES:=udisks2 udisks2.service}"
# The console must never draw over the UI. `fbcon=map:1` in cmdline.txt is the
# primary mechanism (see docs/13-raspberrypi4.md); this is belt and braces.
: "${RB_DISABLE_GETTY:=1}"

# Whether install.sh runs boot-trim.sh, which applies the boot-time changes it
# can make persistently: the service masks above (so the launcher's step 1 stops
# reloading systemd for no-ops), cloud-init off, the apt timers off the boot path,
# and the /boot/firmware tokens and directives. Set it to 0 to install the player
# without touching anything outside the deploy root -- what you want while
# bringing a target up, or if a trim is suspected of breaking a boot. The trim is
# idempotent and reversible on its own: `sh boot-trim.sh apply|revert|status|report`.
: "${RB_BOOT_TRIM:=1}"

# Whether install.sh leaves the systemd unit (rblive4.service) enabled, so the
# player comes up on its own after a reboot. Read by install.sh, not by the
# launcher -- the unit is what starts the launcher, so nothing at runtime needs
# this value. Set it to 0 to install the unit but leave it disabled, which is
# what you want while bringing a target up by hand.
: "${RB_AUTOSTART:=1}"

# usb-watch.sh polls for media with a timeout; Pi OS has coreutils.
: "${RB_USB_TIMEOUT:=/usr/bin/timeout}"
: "${RB_USB_POLL_S:=2}"

# display-watch.sh's poll. It reads three leaves under /sys and compares the
# string to the one rbp was launched with, so the cost is a few file reads and
# the interval only decides how long a monitor swap goes unnoticed. Two seconds
# is usb-watch.sh's number and for the same reason: faster than anyone reaches
# for the cable and slower than anything else on the unit cares about.
: "${RB_DISPLAY_POLL_S:=2}"

# Whether a framebuffer that DISAPPEARED and came back at the SAME geometry
# costs a restart.
#   0 (default) — no. This is the operator's rule and the common case: a forced
#                 `video=` mode is re-added on every hotplug re-probe, so an
#                 unplug/replug normally returns at the same geometry and must
#                 be seamless.
#   1           — yes. It buys the one case that rule can leave black: vc4
#                 tearing the fbdev down and recreating it at identical geometry,
#                 which rbp's held fd and mapping no longer point at. Set it on a
#                 unit that shows a dead picture after a same-mode replug
#                 (docs/13's S10.5 is the drill that decides which you have).
# A change to a DIFFERENT geometry always restarts, whatever this is set to.
: "${RB_DISPLAY_RESTART_ON_RECONNECT:=0}"

# --- boot screen -------------------------------------------------------------
#
# RB_BOOTSCREEN draws the boot-progress screen on /dev/fb0 from the moment the
# real framebuffer exists (`vc4drmfb`, ~6.7 s) until rbp paints its first frame
# (~13-18 s), streaming the launcher's stages from RB_BOOT_LOG below. On the
# blank cold boot it stays up with an honest line ("rbp is running, drawing
# nothing") instead of leaving a black screen -- which is that defect's only
# on-glass sign (docs/13's S12 and the cold-boot note in docs/12).
#
# Read by install.sh, not by the launcher: the screen is its own systemd unit
# (rblive4-boot.service) and it is INSTALLED AND ENABLED WITH THE PLAYER, because
# a screen for a player that does not autostart shows nothing and is one more
# process on a box with nothing to do. Set it to 0 to install the unit but leave
# the screen off; RB_AUTOSTART=0 with it, since the two travel together.
: "${RB_BOOTSCREEN:=1}"

# The rendezvous the launcher appends to (rb_bootmsg in lib.sh) and the screen
# tails. /run, not /tmp: it describes the running boot and not the installed tree,
# and a reboot clearing it is correct. A REGULAR FILE, never a FIFO -- opening a
# reader-less FIFO for write BLOCKS in open(), and during boot the reader may not
# be up yet, so a blocking write there would stall the launcher (lib.sh's
# rb_bootmsg states this in full). install.sh also ships a tmpfiles.d entry that
# creates /run/rblive4 before either writer runs.
: "${RB_BOOT_LOG:=/run/rblive4/boot.log}"

# --- VNC ---------------------------------------------------------------------
#
# rbp's screen, over the network, with a switch between two ways of encoding it.
# docs/19-vnc.md is the long version; this is the configuration.
#
# Whether the viewer runs at all. Read by install.sh, which installs the unit either
# way but enables rblive4-vnc.service only when this is 1.
#
# IT SHIPS OFF, like RB_NETALIAS, and for the same reason: this is a new listening
# socket on the operator's network, and a default that opens one is not a default
# anyone chose. Turning it on is two lines in rb.local.conf and a re-run of
# install.sh, with no rebuild:
#
#   RB_VNC=1
#   RB_VNC_PASSWORD=<something>
#
# BOTH LINES, and that is not padding. With RB_VNC=1 and an empty password the unit
# runs a server macOS will not connect to -- so the state you would be in is
# "enabled and unusable", with doctor.sh failing on it. 0 means the process is never
# started and costs exactly nothing.
: "${RB_VNC:=0}"

# TCP port for the VNC session. 5900 is the convention and is what macOS's Screen
# Sharing assumes when you type `vnc://host`.
: "${RB_VNC_PORT:=5900}"

# The control page. This is where the switch lives: open http://<host>:<this>/ in
# Safari, press either button, and the VNC picture changes on the next frame. It
# also carries a live preview of what the hardware encoder is producing, so the
# JPEG can be judged without switching the shared screen to compare.
#
# AND IT IS ALSO THE FULL-SCREEN VIEW, WHICH IS WHAT IT OPENS IN: the page loads with
# every word hidden -- the picture alone on black, edge to edge, sized to the window --
# and a tap on the picture brings the words back; tap again and they go. That used to be
# a page of its own on a second port, `RB_VNC_PREVIEW_PORT`, which no longer exists --
# the operator wanted one URL to remember, and a state is easier to reach than a port.
#
# The default is one above the VNC port, so there is only one number to remember.
: "${RB_VNC_HTTP_PORT:=$((RB_VNC_PORT + 1))}"

# --- the web client: noVNC in a browser, bridged to the RFB port -------------------------
#
# `rblive4-webvnc.service` runs `websockify`, which serves noVNC from RB_VNC_WEB_ROOT and
# reframes WebSocket bytes to the RFB port. The browser needs no client software, and it is
# the first client this unit can use its HARDWARE JPEG encoder with -- JPEG may only go to a
# client that advertised a quality level, Apple's never does, and noVNC's Tight does.
#
# THE VNC SESSION IS NEGOTIATED END TO END between the browser and vncserve, password
# included: websockify only moves bytes. So this is the same door as the RFB port, from a
# browser -- with sharing OFF there is no listener to reach and a browser connection fails.
#
# It needs the packages `novnc` and `websockify`; install.sh installs the unit only when they
# are present and withholds it otherwise, printing the apt line.
#
#   1 (default) -- install and enable the web client (also needs RB_VNC=1 to have anything to
#                  show: the bridge reaches the viewer, and the viewer only listens when it
#                  is enabled and sharing is on).
#   0           -- no web client.
: "${RB_VNC_WEB:=1}"

# The port the browser points at. 5903 is the port this tree RETIRED once -- a picture-only
# listener on the same page family -- and it is the natural place for the browser's copy of
# the screen. Note the viewer's OWN port moves with RB_VNC_PORT (its page is that + 1), so
# this is the one number in the family that does not shift.
: "${RB_VNC_WEB_PORT:=5903}"

# Where the noVNC page lives. The Debian package puts it under /usr/share/novnc, whose
# `vnc.html` is the entry point. webvnc-run.sh links `index.html -> vnc.html` in this directory
# if there is not one already, because websockify serves a directory LISTING for `/` when there
# is no index.html -- so the bare http://<unit>:5903/ is the client, and not a page of file names.
: "${RB_VNC_WEB_ROOT:=/usr/share/novnc}"

# THE PASSWORD -- ONE CREDENTIAL, TWO SURFACES. It is what the viewer asks a VNC client
# for, and what the configuration page asks before it will write a setting or restart the
# player. Both read it live (the page re-reads the conf per login, so a change takes effect
# at once; the viewer picks it up when it restarts).
#
# macOS's Screen Sharing will not connect to a server that offers no authentication at all
# -- it reads the security list, finds nothing it will accept, and closes the socket with a
# message that does not mention passwords. An empty value here is therefore not "open
# access" for the viewer, it is "does not work from a Mac"; and for the page it is the
# opposite failure again, where an empty password REFUSES writes rather than allowing them.
#
# IT DEFAULTS TO A PLACEHOLDER SO THE FEATURE WORKS OUT OF THE BOX, and that is a
# deliberate, temporary choice: "password" is the first thing anyone would guess. What it
# stands between the operator's LAN and has GROWN -- it used to be a look at the screen,
# and then the decks once RB_VNC_INPUT was on; it is now also the ability to EDIT THIS
# UNIT'S CONFIGURATION and RESTART THE PLAYER from a browser. `doctor.sh` warns while it is
# still the placeholder, so the day it matters is the day a diagnostic says so rather than
# the day someone finds it.
#
# Put a real one in rb.local.conf, which is not part of the tarball and is never
# overwritten by an install. Note also that the launcher passes it on a command line
# (vnc-run.sh execs the binary with --password), so it is readable in /proc/<pid>/cmdline
# by anything that can read /proc -- another reason it is a placeholder and not a secret.
: "${RB_PASSWORD:=password}"

# The viewer's own name for the same credential, kept because vnc-run.sh and doctor.sh read
# it and because rb.local.conf files in the field already set it. It DERIVES from
# RB_PASSWORD unless it is set explicitly -- so setting RB_PASSWORD changes both surfaces,
# and setting only this one still changes the viewer alone. New configurations should set
# RB_PASSWORD; this line is what keeps the old ones working.
: "${RB_VNC_PASSWORD:=$RB_PASSWORD}"

# Frames per second, and the whole cost model. NOTHING IS CAPTURED UNTIL SOMEBODY IS
# WATCHING: with no VNC client and no page open, the loop sleeps and the measured
# cost is 0.17% of one core. When a client is connected, this is the ceiling.
#
# Measured on rpidev01, 2026-10-09, one live client at 4 fps:
#            bandwidth      CPU
#   raw      57.3 Mbit/s    4.50% of one core
#   hwjpeg    1.3 Mbit/s    3.83% of one core
#   zlib      1.73 Mbit/s   8%    of one core   <- what macOS's client really gets
# The CPU is nearly the same in all three because at 4 fps the capture dominates and the
# 2 MB socket write costs about what the encoder does. The bandwith is not nearly
# the same, and this unit is on wlan0. That is what the switch is for.
#
# NOTE that the last row is not a mode on the page -- it is what a real Screen Sharing
# session is sent whatever the mode file says, because Apple's client offers neither
# Tight nor a JPEG quality level. See RB_VNC_ZLIB_LEVEL below.
#
# Raising this costs capture time linearly; it does not change the ratio above.
: "${RB_VNC_FPS:=4}"

# The zlib level for compressing updates, 1..9, or 0 to turn compression off entirely.
#
# THIS GOVERNS BOTH COMPRESSING ENCODINGS -- Tight (7) and zlib (6) -- because underneath
# the wrapper they are the same deflate stream over the same row bands. The name says
# zlib because that is the library, not because it is the encoding.
#
# 0 does NOT mean "compress at level 0". It means "send everything Raw, uncompressed",
# which is also what a client that offers neither encoding gets. At 4 fps on this unit it
# is level 1 that was measured at 1.73 Mbit/s and 8% of one core, and level 1 is the
# default because the capture dominates the cost anyway.
#
# vnc-run.sh passes this as --zlib-level, NOT through the environment. rb_load_conf sets
# shell variables and does not export them, so an unexported value here would be read by
# nothing and the server would quietly take its own default -- which is how a setting can
# sit in this file, look right, and never reach the process.
: "${RB_VNC_ZLIB_LEVEL:=1}"

# WHICH ENCODER MAKES THE JPEG. There are two on this SoC and they are not the same encoder:
#
#   /dev/video11 -- bcm2835-codec-encode, the VIDEO encoder. What this unit has always used.
#                   Its MJPG path exposes NO quality control at all: the kernel refuses
#                   V4L2_CID_JPEG_COMPRESSION_QUALITY on it, which is why vnc_jpeg.h says
#                   there is no quality setting anywhere in the program.
#   /dev/video31 -- bcm2835-codec-encode_image, the IMAGE encoder. It DOES expose one, 1-100,
#                   and it streams: measured on this unit, 1280x800 from the live screen,
#                   60-65 fps (15.5 ms a frame) against a 12 fps budget.
#
# THEY DO NOT COMPRESS ALIKE, and that is the whole decision. For the same screen the video
# encoder produces about 45 KB a frame; the image encoder at its own default of 80 produces
# about 182 KB -- four times the bytes for the same picture. So switching node to gain the
# knob means setting RB_VNC_JPEG_QUALITY at the same time: measured on the live screen,
# quality 20 is 72 KB, 40 is 104 KB, 60 is 132 KB and 80 is 182 KB. Around 10-15 is where
# the image encoder's bytes match what the video encoder gives today.
#
# THE DEFAULT IS THE CONSERVATIVE PAIR, deliberately: the node already in use, at a quality
# of 0 meaning "leave that node's own default alone" (which is the only correct value there).
# So nothing about this unit's picture or its bandwidth changes until somebody chooses to.
: "${RB_VNC_JPEG_DEV:=/dev/video11}"

# 0 leaves the encoder's own default alone -- correct, and the only valid value, on
# /dev/video11. On /dev/video31 it is the knob described above, 1..100.
: "${RB_VNC_JPEG_QUALITY:=0}"

# Which encoding to start in, before anything has been chosen on the page:
#   raw     -- every pixel, every frame, no compression. Exact, and 2 MB a frame.
#   hwjpeg  -- the Pi's own hardware JPEG block (/dev/video11). ~40 KB a frame.
#
# This is only the STARTING value. The live choice lives in the file below, which
# the page writes and the server re-reads every frame, so a change made on the page
# survives a restart of the service and this value is what a fresh reboot comes back
# to. Set it to whichever you would rather the unit default to.
:  "${RB_VNC_MODE:=raw}"

# The control file holding the live choice. /run rather than /tmp or the deploy root:
# it describes the running system and not the installed one, and a reboot clearing it
# is the correct behaviour -- it comes back at RB_VNC_MODE above.
: "${RB_VNC_MODE_FILE:=/run/rblive4/vnc.mode}"

# Pointer from the VNC client, injected into rbp's own input nodes the same way
# work/poke.py does. THIS IS REMOTE CONTROL OF A LIVE PLAYER: a click in the picture
# is a real press on the glass, and there is no undo for one that lands on the wrong
# control. (Keyboard is NOT wired: the server still logs and ignores KeyEvent. The
# pointer is the whole of it.)
#
# IT SEEDS A SWITCH FILE, it is not the switch. The server starts in this position,
# and from then on the switch is /run/rblive4/vnc.input -- which the control page's
# on/off button writes, and which the server re-reads on every turn. So the page is
# the control (a browser already looking at the screen beats an editor on the unit),
# the file outlives a restart of the viewer, and THIS VALUE is the position after a
# reboot -- because /run does not survive one. That last one is the reason the
# shipped value is the safe direction: a reboot is not a way to acquire remote
# control of the decks.
#
# OFF means the server does not even open the input node, so an off viewer is a viewer
# and nothing else. 0 is the shipped default.
#
# IT REACHES THE SERVER ONLY THROUGH vnc-run.sh, which passes it as --input: rb_load_conf
# sets a shell variable and does not export it, so a value here that the launcher does
# not pass is a line that looks like a setting and is read by nothing.
: "${RB_VNC_INPUT:=0}"

# --- whether the screen is served at all ------------------------------------
# OFF (the shipped default) means vncserve still starts and still serves its
# control page, and opens NOTHING else: no /dev/fb0, no /dev/dri/card1, no RFB
# listener -- so it cannot be the reason a display behaves differently at boot,
# because there is no display code left in it to run.
#
# THE PAGE IS THE POINT, and it is why this defaults off rather than the service
# being off. The server comes up at ~6.9 s on this unit, before the player
# (10.3 s) and before rbp itself (15.0 s). On a unit whose player can come up
# blank on a cold boot, the honest default is the one that leaves the boot exactly
# as it was before this program existed; browsing to the page and pressing a button
# puts sharing back in one tap, with no editor and no restart.
#
# Like RB_VNC_INPUT, this SEEDS a switch file and is not the switch: the live
# control is /run/rblive4/vnc.live, which the page writes and the server re-reads
# every turn, and it does not survive a reboot -- so THIS value is the position
# after a reboot, and the safe direction is the shipped one.
#
# IT REACHES THE SERVER ONLY THROUGH vnc-run.sh, which passes it as --live.
: "${RB_VNC_LIVE:=off}"
: "${RB_VNC_LIVE_FILE:=/run/rblive4/vnc.live}"

# --- shim contract ----------------------------------------------------------
# Order is load-bearing: the controls shim DEFINES the globals that the audio
# shim reads (see scripts/shims/shmstate.h). Wrong order fails loudly.
#
# crashcatch comes FIRST, and for a different reason: it is the exit witness
# (scripts/shims/crashcatch.c), and its constructor is what arms the fatal-signal
# handlers and resolves the real `exit`. Anything loaded ahead of it could fault
# or exit before either exists. It touches no shared state, so putting it in
# front does not disturb the contract above.
#
# netshim comes SECOND, and that position is the whole of its contract: it and
# fbshim BOTH define ioctl (fb_shim.c:180), and a process resolves ioctl to the
# first preloaded object that defines it. After fbshim it would rewrite nothing
# and say nothing; before fbshim it must forward every call it does not want, and
# it does, through dlsym(RTLD_NEXT). doctor.sh checks this order. See
# scripts/shims/netshim.c and docs/18-prodjlink.md.
: "${RB_LD_PRELOAD:=/usr/lib/crashcatch.so:/usr/lib/netshim.so:/usr/lib/fbshim.so:/usr/lib/knobshim.so:/usr/lib/audioshim.so}"
: "${RB_SHMSTATE_STRICT:=1}"

# Where crashcatch appends its lines. **This is a CHROOT path, not a host one**:
# rbp runs inside $RB_CHROOT, whose /opt is empty, so the host's
# $RB_DEPLOY_ROOT/log is not reachable from the process being watched -- naming
# it here would silently fall back to the /tmp tmpfs and lose the evidence on the
# next reboot. /root/pdj is inside the chroot *and* on the SD card.
: "${RB_CRASH_LOG:=/root/pdj/crash.log}"

# --- the network alias (netshim.so) ------------------------------------------
#
# rbp's Pro DJ Link stack asks the kernel about ONE interface by name — the
# literal "eth0", from twelve functions — and this unit's eth0 is DOWN with
# carrier 0 while wlan0 carries the LAN. netshim answers those twelve functions'
# queries about whichever interface is actually up. docs/18-prodjlink.md has the
# whole argument, including the read-only whitelist that keeps it away from
# every SIOCSIF* setter (retargeting one of those would write rbp's idea of an
# address onto the link carrying your own SSH session).
#
# OFF BY DEFAULT, and it ships that way on purpose: with RB_NETALIAS=0 every hook
# is a pass-through, so installing the shim changes nothing until you say so.
# Turn it on by putting RB_NETALIAS=1 in rb.local.conf — NOT here, because this
# file is replaced on every install.
#
#   0 (default)  — every hook passes through. RB_NETALIAS_LOG still works.
#   1            — substitute at the three interposers.
: "${RB_NETALIAS:=0}"

# Answer for this interface instead of eth0. Empty means auto-detect: use eth0 if
# it is ever up, otherwise the first live, non-loopback interface with an IPv4
# address, preferring a wireless name (wlan0 on this unit). A name here that is
# not present falls back to that auto-detection rather than to doing nothing.
: "${RB_NETALIAS_IFACE:=}"

# Whether netshim's `system` hook may change what it runs. OFF means it only
# logs, which is the shipped state: nothing rbp runs through `system` needs
# touching for Link to work. ON lets it refuse `udhcpc` (never rewritten — a
# lease solicited on wlan0 would be a new lease on YOUR link) and rewrite the
# `ifconfig | awk '/^eth/'` MAC scrape.
: "${RB_NETALIAS_MAC_SCRAPE:=0}"

# Write /tmp/netshim.log. That is a DRILL instrument and it is on tmpfs: read it
# before any reboot. Every distinct ioctl request, `system` line and the alias
# decision appears exactly once, so the file is small — but see
# scripts/shims/netshim.c's header for why a per-call log line would not be.
: "${RB_NETALIAS_LOG:=0}"

# Whether netshim may MAKE THE ONE CALL that puts the player on the Link.
#
# Answering the twelve eth0 queries is not enough on its own: the call that
# actually brings the stack up, NetworkManager::operateConnectNetwork, HAS NO
# CALLER anywhere in rbp — it is virtual and the interface owning it is never
# invoked — so the stack is constructed and silent however well the substitution
# works. Arming this lets the shim call it directly, ON DEMAND: nothing happens
# until a request FILE appears, so arming it costs a 4-per-second stat() and
# nothing else.
#
#   0 (default)  — no thread, no file, no call. The shipped state.
#   1            — poll the file below; on a request, call into rbp once.
#
# ARMING THIS TURNS THE LOG ON. It is the one thing in netshim that runs rbp's
# own code, and its outcomes are "it worked" and "silence", which read the same
# from outside if nothing is written down. See scripts/shims/netshim.c.
#
# Test it OFF-AIR: sources loaded, nothing playing, SYNC off. A player that joins
# a live Pro DJ Link network takes a device number, appears in every CDJ's LINK
# list, and can become a tempo reference another deck would follow.
#
# This is armed TOGETHER WITH RB_NETALIAS, not instead of it. The call refuses
# while rbp's NetworkMonitor holds no address, and the only thing that gives it
# one is the substitution — so arming this alone logs `refused verdict=no-ip`
# forever. The two are separate switches because they fail separately: the
# substitution is proven and the call is not.
: "${RB_NETALIAS_CONNECT:=0}"

# The trigger file RB_NETALIAS_CONNECT polls for. Create it with one command —
#   echo > /tmp/rb_link.req
# — and watch /tmp/netshim.log. The file is REMOVED just before the call is made,
# so a request fires exactly once; a request that arrives before rbp has a
# network address is KEPT and retried, with each refusal logged once.
#
# It lives on /tmp on purpose: it is a drill instrument, it should not survive a
# reboot, and a stale one is then visibly gone rather than silently pending.
: "${RB_NETALIAS_CONNECT_FILE:=/tmp/rb_link.req}"

# --- the status page, and the config page that will live on it ----------------
#
# `confscreen.py`, served by `rblive4-conf.service`. It is the page that is up when the
# viewer is not: the control page served by `vncserve` exists only while `RB_VNC=1`, so
# it cannot be the page you turn VNC on from. As landed it READS and reports -- status
# only, no write path -- and the config form, its password and its restart button are
# the next landing. See docs/20-config-page.md.
#
# Deliberately NOT gated on RB_VNC or RB_AUTOSTART (see install.sh's gate): the page has
# to be up on a unit whose player is disabled and whose viewer was never installed.
: "${RB_CONF:=1}"

# The page's port, and 5904 rather than the viewer's page port on purpose: until the
# viewer's own page moves to loopback-only (which happens with the write path), both
# pages would want the same number on this unit.
: "${RB_CONF_HTTP_PORT:=5904}"

# What it binds. Reads are open on the LAN by design; the write path is what will keep
# that honest -- a write, and a restart, will need the password.
: "${RB_CONF_BIND:=0.0.0.0}"

# THERE IS NO RB_CONF_AUTH ANY MORE. The page used to be able to demand RB_PASSWORD before
# it wrote anything, and the operator retired that: there is no sign-in form, no session, and
# nothing to opt into. The writes are held back by a same-origin check and by the fact that
# the port is on a LAN the operator controls -- the page says exactly that at the top rather
# than implying a lock it does not have, and doctor.sh no longer reports a lock either.
# RB_PASSWORD is still a setting, and still the VNC client's password; it is nothing to do
# with this page now.

# THE PAGE HAS NO REFRESH INTERVAL. It had RB_CONF_REFRESH_S -- how often it re-read its data,
# default 5 seconds -- and the operator took it off: a section is re-read when you switch to it
# and not on a timer. The timer was also a fault rather than only a preference, because a timed
# swap re-creates every control in the section it swaps, so a slider being dragged was rebuilt
# under the operator's hand. The setting is gone; the page carries no interval to configure.

# --- local overrides ---------------------------------------------------------
#
# Everything above is a SHIPPED DEFAULT and every one of them is rewritten on the
# next install — twice over, in fact: rb.conf travels inside the tarball, so
# `tar -xzf` in install.sh replaces it before the script's own `cp` runs. A value
# measured on the unit therefore cannot live in this file. RB_POINT_KIND=rel, set
# here by hand after the four-corner procedure, silently reverted to `auto` on the
# next deploy — and the symptom is a pointer that works on the bench it was
# calibrated on and nowhere else. **The reverse bites too, and was measured on
# 2026-09-27: a `rel` pin outlived the mouse it was measured for, and the unit's
# actual pointer — an absolute CTouch panel — was filtered out by it, silently,
# until the pin was removed.** A pin is a statement about the hardware as it was,
# so it needs re-measuring whenever the hardware is.
#
# Values that must survive a redeploy go here instead: rb.local.conf is NOT part
# of the tarball and install.sh never writes it, so nothing in the deploy path can
# touch it.
#
# Assign PLAINLY here, not with `:=`. This file is sourced last, precisely so that
# a plain assignment overrides the default above; `:=` would leave the default in
# place and do nothing.
#
#   RB_POINT_INVERT_X=1                # if the four-corner procedure says so
#   RB_JOG_PPR=718.3                   # a jog re-measured on a different unit
#   RB_MIDI_DUMP=/tmp/flx4.dump        # keep a dump while a control's numbers are unknown
#
# No pointer example, deliberately: this unit's measured answer is the `auto`
# default above (a CTouch panel and a mouse are both live, and the shim prefers
# absolute), so a pin here would be a claim about hardware that has already
# changed once.
if [ -f "${RB_DEPLOY_ROOT:-/opt/rblive4}/rb.local.conf" ]; then
    # RB_CONF_VERSION describes the SHAPE of this file, which a local override
    # does not change — so it is not a value local.conf gets to set. A stray
    # `RB_CONF_VERSION=99` in there would make lib.sh's guard reject every device
    # script, and the message ("schema v99, expected v2") would point at rb.conf,
    # which is fine. Hold the shipped value across the sourcing rather than
    # repeating the number here, so there is still only one place it is written.
    _rb_shipped_conf_version="$RB_CONF_VERSION"
    . "${RB_DEPLOY_ROOT:-/opt/rblive4}/rb.local.conf"
    RB_CONF_VERSION="$_rb_shipped_conf_version"
    unset _rb_shipped_conf_version
fi
