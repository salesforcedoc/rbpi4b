# journald-persistent.conf — keep the journal across reboots.
#
# Installed by install.sh to /etc/systemd/journald.conf.d/persistent.conf.
#
# Why this is not optional on this target: an appliance that boots unattended and
# can brown out has exactly one piece of evidence about why it went down, and by
# default that evidence is in RAM. The measured unit has no persistent journal at
# all, so `journalctl -b -1` answers "no persistent journal was found" and a
# reboot caused by under-voltage is indistinguishable from a clean one -- which is
# precisely the question that could not be answered after the 2026-09-26 00:12
# reboot.
#
# Storage=persistent creates /var/log/journal if it does not exist; install.sh
# also does `mkdir -p /var/log/journal` because a directory that already exists
# with the right ownership is more predictable than one journald creates itself
# partway through its own startup.
#
# SystemMaxUse=200M is a size chosen for an SD card, not for a server: the
# launcher and rbp are quiet, so this is weeks of boot history, and the cap keeps
# the journal from being the thing that fills the card. Raise it if you have an
# SSD; drop the file entirely (and `rm -rf /var/log/journal`) to go back to
# volatile.

[Journal]
Storage=persistent
SystemMaxUse=200M
